[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ciro-rl"
version = "0.1.0"
description = "CIRO: Conditional Independence Regularization for contrastive state-representation learning in offline RL, plus the ACS and DTG diagnostics. Companion repo to the CIR paper."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "TODO: pick a license (see README)" }
authors = [{ name = "aditya-kiev" }]
keywords = ["representation-learning", "contrastive-learning", "offline-rl", "causality", "hsic"]

# Core dependencies. DCS (distracting_control / dm_control) is OPTIONAL and
# installed separately by scripts/setup_colab.sh because it needs MuJoCo/EGL.
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dcs = [
    "dm-control>=1.0.29",
    "distracting-control>=0.0.1",
]
quality = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["ciro_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]